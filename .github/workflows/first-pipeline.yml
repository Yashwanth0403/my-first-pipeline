
name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Welcome
        run: echo "My first CI pipeline is running"

      - name: Check application
        run: cat index.html

      - name: Test application
        run: grep -q "Hello! My first DevOps pipeline." index.html

      - name: Test successful message
        run: echo "Application test passed!"

