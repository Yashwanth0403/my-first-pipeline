
name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Welcome
        run: echo "Hello! My first pipeline is running."

      - name: Check application
        run: cat index.html

      - name: Show current directory
        run: pwd

      - name: Show files
        run: ls -la

